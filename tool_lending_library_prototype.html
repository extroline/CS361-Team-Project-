<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool Lending Library</title>
  <style>
    :root {
      --nav-bg: #141d22;
      --nav-text: #f3f4f6;
      --bg: #f7f6f2;
      --surface: #ffffff;
      --surface-muted: #f3f1eb;
      --border: #e1ded6;
      --border-strong: #c7c3b9;
      --text: #182026;
      --text-muted: #5b6369;
      --accent: #b34700;
      --accent-hover: #933a00;
      --accent-soft: #fdf4ec;
      --link: #1d4ed8;

      --green-bg: #daf0e2;
      --green-text: #176636;
      --amber-bg: #faecc8;
      --amber-text: #7c4f06;
      --blue-bg: #dce8fc;
      --blue-text: #1e4e94;
      --red-bg: #f9dcd8;
      --red-text: #9b261e;
      --gray-bg: #eae8e2;
      --gray-text: #54595e;

      --radius: 10px;
      --radius-sm: 7px;
      --shadow: 0 1px 2px rgba(20, 29, 34, 0.04);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation Bar */
    .topbar {
      background: var(--nav-bg);
      color: var(--nav-text);
      padding: 0 28px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-link {
      background: transparent;
      border: none;
      color: #d6dde2;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .nav-link.active {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    .nav-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      line-height: 1.4;
    }

    /* Layout */
    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 64px;
      flex: 1;
    }

    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    .page-title {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .breadcrumb {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .muted { color: var(--text-muted); }
    .small { font-size: 0.86rem; }

    /* Cards & Grids */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      margin: 0 0 14px 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .split-browse {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .split-inventory {
      display: grid;
      grid-template-columns: minmax(0, 1.85fr) minmax(300px, 1fr);
      gap: 22px;
      align-items: start;
    }

    /* Stat Cards */
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    /* Alert Banner */
    .alert {
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 0.94rem;
      border: 1px solid transparent;
    }

    .alert-danger {
      background: #fdf2f0;
      border-color: #c77c74;
      color: #3a1410;
    }

    .alert-success {
      background: #eef8f2;
      border-color: #82c49c;
      color: #134a28;
    }

    .alert-info {
      background: #f1f5fd;
      border-color: #9cb9ea;
      color: #163669;
    }

    .alert-warn {
      background: #fef8e7;
      border-color: #d9b458;
      color: #5c3b04;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border-strong);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-muted);
      border-color: #9e9a90;
    }

    .btn-danger-outline {
      background: var(--surface);
      color: var(--red-text);
      border-color: #dfb4af;
    }
    .btn-danger-outline:hover:not(:disabled) { background: #fdf2f0; }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 500;
    }

    .btn-block { width: 100%; }

    .link-btn {
      background: none;
      border: none;
      padding: 0;
      color: var(--link);
      text-decoration: underline;
      font: inherit;
      cursor: pointer;
    }
    .link-btn:hover { color: #1e3a8a; }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-green { background: var(--green-bg); color: var(--green-text); }
    .badge-amber { background: var(--amber-bg); color: var(--amber-text); }
    .badge-blue { background: var(--blue-bg); color: var(--blue-text); }
    .badge-red { background: var(--red-bg); color: var(--red-text); }
    .badge-gray { background: var(--gray-bg); color: var(--gray-text); }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    th {
      text-align: left;
      font-weight: 700;
      font-size: 0.84rem;
      color: var(--text);
      padding: 10px 10px 10px 0;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 13px 10px 13px 0;
      border-bottom: 1px solid #efede7;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    /* Forms */
    .form-group { margin-bottom: 14px; }

    label.field-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="email"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.93rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(179, 71, 0, 0.25);
      border-color: var(--accent);
    }

    textarea { min-height: 86px; resize: vertical; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.92rem;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .checkbox-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    /* Tool Cards */
    .tool-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .tool-photo {
      background: #e8e6de;
      border-radius: 7px;
      height: 138px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #5b6369;
      font-size: 0.82rem;
      gap: 6px;
    }

    .tool-photo-lg {
      height: 360px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .tool-name {
      font-weight: 700;
      font-size: 1.02rem;
      margin: 0;
    }

    /* Report Selector Cards */
    .report-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .report-tab:hover { border-color: var(--border-strong); }

    .report-tab.active {
      background: var(--accent-soft);
      border: 2px solid var(--accent);
    }

    .report-tab-title {
      font-weight: 700;
      font-size: 0.98rem;
      margin-bottom: 4px;
      color: var(--text);
    }

    /* Inventory accordion card */
    .inv-group {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      margin-bottom: 14px;
      background: #fff;
    }

    .inv-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 12px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 29, 34, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      padding: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--nav-bg);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      z-index: 120;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    .footer {
      border-top: 1px solid var(--border);
      padding: 16px 28px;
      font-size: 0.83rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #f2f0ea;
    }

    /* Hero / Auth */
    .auth-shell {
      max-width: 460px;
      margin: 28px auto;
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 36px;
      margin-bottom: 24px;
    }

    .demo-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .kv-table td { padding: 9px 10px 9px 0; }
    .kv-label { font-weight: 600; width: 42%; color: var(--text); }

    @media (max-width: 900px) {
      .grid-3, .grid-4, .split-browse, .split-inventory, .grid-2 {
        grid-template-columns: 1fr;
      }
      .topbar {
        height: auto;
        padding: 12px 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .container { padding: 20px 16px 48px; }
    }
  </style>
</head>

    /*************************************************************************
     * DATE, FEE & DOMAIN HELPERS
     *************************************************************************/
    function parseDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDateShort(str) {
      if (!str) return "—";
      const d = parseDate(str);
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function addDays(str, days) {
      const d = parseDate(str);
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function diffDays(fromStr, toStr) {
      const a = parseDate(fromStr);
      const b = parseDate(toStr);
      return Math.round((b - a) / (1000 * 60 * 60 * 24));
    }

    function formatMoney(n) {
      return "$" + Number(n || 0).toFixed(2);
    }

    function getToolType(id) {
      return state.toolTypes.find(t => t.id === id);
    }

    function getUnit(id) {
      return state.units.find(u => u.id === id);
    }

    function getPatron(id) {
      return state.patrons.find(p => p.id === id);
    }

    function getCurrentPatron() {
      return state.session.role === "patron" ? getPatron(state.session.patronId) : null;
    }

    function getUnitsForType(toolTypeId) {
      return state.units.filter(u => u.toolTypeId === toolTypeId && u.status !== "Retired");
    }

    function getAvailableUnitsForType(toolTypeId) {
      return state.units.filter(u => u.toolTypeId === toolTypeId && u.status === "Available");
    }

    function getWaitlistForType(toolTypeId) {
      return state.reservations.filter(r => r.toolTypeId === toolTypeId && r.status === "Waitlist");
    }

    function getActiveLoansForPatron(patronId) {
      return state.loans.filter(l => l.patronId === patronId && !l.returnedDate);
    }

    function isLoanOverdue(loan) {
      if (loan.returnedDate) return false;
      return diffDays(loan.dueDate, TODAY) > 0;
    }

    // Fee rules from spec:
    // 1-day grace period, then $1/day (standard) or $3/day (high-demand), capped at min(replacementValue, $20)
    function computeLoanFeeDetails(loan) {
      const tool = getToolType(loan.toolTypeId);
      const endDate = loan.returnedDate || TODAY;
      const daysLate = Math.max(0, diffDays(loan.dueDate, endDate));
      const chargedDays = Math.max(0, daysLate - 1); // 1 day grace period
      const dailyRate = tool && tool.feeClass === "high" ? 3 : 1;
      const cap = Math.min(tool ? tool.replacementValue : 20, 20);
      const totalAccrued = Math.min(chargedDays * dailyRate, cap);
      const unpaid = Math.max(0, totalAccrued - (loan.feePaid || 0));
      return { daysLate, chargedDays, dailyRate, cap, totalAccrued, unpaid };
    }

    function getPatronOutstandingFees(patronId) {
      return state.loans
        .filter(l => l.patronId === patronId)
        .reduce((sum, l) => sum + computeLoanFeeDetails(l).unpaid, 0);
    }

    function patronHasOverdue(patronId) {
      return getActiveLoansForPatron(patronId).some(isLoanOverdue);
    }

    function cardEnding(cardNumber) {
      return cardNumber ? cardNumber.slice(-4) : "0000";
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function initFromHash() {
      const h = (location.hash || "").replace(/^#\/?/, "");
      if (h === "staff" || h === "staff/login") {
        route = { page: state.session.role === "staff" ? "staff_home" : "staff_login", params: {} };
      } else if (h.startsWith("staff/") && state.session.role === "staff") {
        const sub = h.split("/")[1];
        const map = {
          dashboard: "staff_home", checkout: "staff_checkout", return: "staff_return",
          renewals: "staff_renewals", inventory: "staff_inventory",
          reservations: "staff_reservations", unreturned: "staff_unreturned", reports: "staff_reports"
        };
        route = { page: map[sub] || "staff_home", params: {} };
      } else if (h.startsWith("patron/") && state.session.role === "patron") {
        const sub = h.split("/")[1];
        const map = {
          dashboard: "patron_dashboard", browse: "patron_browse",
          loans: "patron_loans", reservations: "patron_reservations", fees: "patron_fees"
        };
        route = { page: map[sub] || "patron_dashboard", params: {} };
      } else if (state.session.role === "patron") {
        route = { page: "patron_dashboard", params: {} };
      } else if (state.session.role === "staff") {
        route = { page: "staff_home", params: {} };
      } else {
        route = { page: "landing", params: {} };
      }
    }

    function handleRegisterCard(e) {
      e.preventDefault();
      const card = document.getElementById("reg-card").value.trim().toUpperCase();
      const pass = document.getElementById("reg-pass").value;
      const errBox = document.getElementById("reg-error");

      if (state.patrons.some(p => p.cardNumber.toUpperCase() === card)) {
        errBox.innerHTML = `<div class="alert alert-danger small">An account with card <strong>${escapeHtml(card)}</strong> already exists. Please log in instead.</div>`;
        return;
      }

      const apiRecord = state.countyApiCards[card];
      if (!apiRecord || !apiRecord.valid) {
        errBox.innerHTML = `<div class="alert alert-danger small"><strong>County Library API Error:</strong> Card <code>${escapeHtml(card)}</code> could not be validated. Please check your card number or contact the main library.</div>`;
        return;
      }

      ui.regCardNumber = card;
      ui.regCardData = { ...apiRecord, cardNumber: card, password: pass };
      navigate("waiver");
    }

      const d = ui.regCardData;
      return `

            <h1 class="page-title" style="font-size:1.55rem; margin-bottom:6px;">Electronic Liability Waiver</h1>

            </p>

              <p style="margin-top:0;"><strong>Tool Lending Library Borrowing Agreement &amp; Waiver</strong></p>
              <p>1. I confirm that I am at least 18 years of age and will present valid photo ID upon every in-person checkout.</p>
              <p>2. I agree to use all borrowed tools safely and only for their intended purpose. I release the County Library and its staff from liability for injuries or property damage resulting from tool use.</p>
              <p>3. I understand I may borrow up to 5 tools for up to 14 days, and that late fees ($1/day standard, $3/day high-demand, capped at the lesser of replacement value or $20) apply after a 1-day grace period.</p>

    function handleSignWaiver(e) {
      e.preventDefault();
      const d = ui.regCardData;
      const newPatron = {
        id: "P" + (state.patrons.length + 1),
        name: d.name,
        firstName: d.name.split(" ")[0],
        cardNumber: d.cardNumber,
        email: d.email,
        password: d.password || "patron123",
        waiverSigned: true,
        waiverDate: TODAY,
        createdAt: TODAY,
        payments: []

      state.patrons.push(newPatron);
      state.session = { role: "patron", patronId: newPatron.id, staffName: null };

      ui.regCardNumber = "";
      saveState();
      navigate("patron_dashboard");
      showToast(`Welcome, ${newPatron.firstName}! Waiver signed and account created.`);
    }

    /*************************************************************************
     * PATRON PORTAL PAGES (UC2 - UC7)
     *************************************************************************/
    function renderPatronDashboard() {
      const p = getCurrentPatron();
      const activeLoans = getActiveLoansForPatron(p.id);
      const myRes = state.reservations.filter(r => r.patronId === p.id);
      const activeHolds = myRes.filter(r => r.status === "Ready for pickup").length;
      const feesOwed = getPatronOutstandingFees(p.id);
      const overdueLoans = activeLoans.filter(isLoanOverdue);

      return `
        <h1 class="page-title" style="margin-bottom:22px;">Welcome back, ${escapeHtml(p.firstName)}</h1>

        <div class="grid-3" style="margin-bottom:20px;">
          <div class="stat-card">
            <div class="stat-label">Tools borrowed</div>
            <div class="stat-value">${activeLoans.length} of 5</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active reservations</div>
            <div class="stat-value">${activeHolds}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Fees owed</div>
            <div class="stat-value">${formatMoney(feesOwed)}</div>
            <button class="link-btn small" style="margin-top:4px;" onclick="navigate('patron_fees')">View and pay fees</button>
          </div>
        </div>

        ${overdueLoans.map(l => {
          const t = getToolType(l.toolTypeId);
          return `
            <div class="alert alert-danger">
              <strong>Overdue:</strong> ${escapeHtml(t.name)} was due ${formatDateShort(l.dueDate)} and fees are accruing. You can't borrow more tools until it is returned.
            </div>
          `;
        }).join("")}

        <div class="card">
          <div class="card-title">My borrowed tools</div>
          ${activeLoans.length === 0 ? `<p class="muted small">You currently have no tools checked out. <button class="link-btn" onclick="navigate('patron_browse')">Browse tools</button></p>` : `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Tool</th><th>Due</th><th>Time left</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody>
                  ${activeLoans.map(l => renderLoanRow(l)).join("")}
                </tbody>
              </table>
            </div>
          `}
          <div style="margin-top:14px;">
            <button class="link-btn small" onclick="navigate('patron_loans')">View full borrowing history</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Reservations and waitlists</div>
          ${myRes.length === 0 ? `<p class="muted small">No active reservations or waitlists.</p>` : `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Tool</th><th>Status</th><th>Details</th><th>Action</th></tr>
                </thead>
                <tbody>
                  ${myRes.map(r => renderReservationRow(r)).join("")}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function renderLoanRow(l) {
      const t = getToolType(l.toolTypeId);
      const daysDiff = diffDays(TODAY, l.dueDate);
      const overdue = daysDiff < 0;
      const waitlistCount = getWaitlistForType(l.toolTypeId).length;

      let timeLeft = overdue
        ? `${Math.abs(daysDiff)} day${Math.abs(daysDiff) === 1 ? "" : "s"} overdue`
        : daysDiff === 0 ? "Due today" : `${daysDiff} day${daysDiff === 1 ? "" : "s"}`;

      let statusBadge = overdue
        ? `<span class="badge badge-red">Unreturned</span>`
        : `<span class="badge badge-green">On loan</span>`;

      let actionHtml = "";
      if (overdue) {
        actionHtml = `<span class="small muted">Renewal not available</span>`;
      } else if (l.renewed) {
        actionHtml = `<span class="small muted">Already renewed once</span>`;
      } else if (l.renewalStatus === "pending") {
        actionHtml = `<span class="badge badge-amber">Renewal pending</span>`;
      } else if (l.renewalStatus === "denied") {
        actionHtml = `<span class="small muted">Denied: ${escapeHtml(l.renewalReason || "Not eligible")}</span>`;
      } else if (waitlistCount > 0) {
        actionHtml = `<span class="small muted">Waitlist active (${waitlistCount})</span>`;
      } else {
        actionHtml = `<button class="btn btn-secondary btn-sm" onclick="openRenewalModal('${l.id}')">Request renewal</button>`;
      }

      return `
        <tr>
          <td><strong>${escapeHtml(t.name)}</strong></td>
          <td>${formatDateShort(l.dueDate)}</td>
          <td>${timeLeft}</td>
          <td>${statusBadge}</td>
          <td>${actionHtml}</td>
        </tr>
      `;
    }

    function renderReservationRow(r) {
      const t = getToolType(r.toolTypeId);
      const isHold = r.status === "Ready for pickup";
      let details = "";
      if (isHold) {
        details = `Pick up by ${formatDateShort(r.pickupBy)}`;
      } else {
        const list = getWaitlistForType(r.toolTypeId);
        const pos = list.findIndex(item => item.id === r.id) + 1;
        details = `Position ${pos} of ${list.length}`;
      }
      return `
        <tr>
          <td><strong>${escapeHtml(t.name)}</strong></td>
          <td><span class="badge badge-green">${escapeHtml(r.status)}</span></td>
          <td>${details}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="cancelReservation('${r.id}')">
              ${isHold ? "Cancel reservation" : "Leave waitlist"}
            </button>
          </td>
        </tr>
      `;
    }

    function openRenewalModal(loanId) {
      const l = state.loans.find(x => x.id === loanId);
      const t = getToolType(l.toolTypeId);
      const proposedDue = addDays(l.dueDate, l.originalDays || 14);
      openModal(`
        <h2 class="card-title">Request Renewal</h2>
        <p class="small muted">Submit a one-time renewal request for <strong>${escapeHtml(t.name)}</strong>. A library employee will review and approve or deny your request.</p>
        <table class="kv-table" style="margin-bottom:16px;">
          <tr><td class="kv-label">Current due date</td><td>${formatDateShort(l.dueDate)}</td></tr>
          <tr><td class="kv-label">Requested new due date</td><td>${formatDateShort(proposedDue)} (+${l.originalDays || 14} days)</td></tr>
          <tr><td class="kv-label">Waitlist check</td><td><span class="badge badge-green">No patrons waiting</span></td></tr>
        </table>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitRenewalRequest('${l.id}')">Submit request</button>
        </div>
      `);
    }

    function submitRenewalRequest(loanId) {
      const l = state.loans.find(x => x.id === loanId);
      if (l) {
        l.renewalStatus = "pending";
        saveState();
        closeModal();
        render();
        showToast("Renewal request submitted for staff review.");
      }
    }

    function cancelReservation(resId) {
      const idx = state.reservations.findIndex(r => r.id === resId);
      if (idx !== -1) {
        const removed = state.reservations.splice(idx, 1)[0];
        // If a Ready for pickup hold was cancelled and someone is on waitlist, promote #1
        if (removed.status === "Ready for pickup") {
          promoteNextWaitlist(removed.toolTypeId);
        }
        saveState();
        render();
        showToast(removed.status === "Ready for pickup" ? "Reservation cancelled." : "Removed from waitlist.");
      }
    }

    function promoteNextWaitlist(toolTypeId) {
      const avail = getAvailableUnitsForType(toolTypeId).length;
      const activeHolds = state.reservations.filter(r => r.toolTypeId === toolTypeId && r.status === "Ready for pickup").length;
      if (avail > activeHolds) {
        const next = state.reservations.find(r => r.toolTypeId === toolTypeId && r.status === "Waitlist");
        if (next) {
          next.status = "Ready for pickup";
          next.pickupBy = addDays(TODAY, 3);
        }
      }
    }

    function renderPatronBrowse() {
      const p = getCurrentPatron();
      const activeLoans = getActiveLoansForPatron(p.id);
      const categories = [...new Set(state.toolTypes.map(t => t.category))];

      let list = state.toolTypes.filter(t => {
        const units = getUnitsForType(t.id);
        if (units.length === 0) return false; // Hide completely retired tool types from patron browse
        if (ui.browseSearch && !t.name.toLowerCase().includes(ui.browseSearch.toLowerCase()) && !t.category.toLowerCase().includes(ui.browseSearch.toLowerCase())) return false;
        if (ui.browseCategory !== "all" && t.category !== ui.browseCategory) return false;
        if (ui.browseAvailableOnly && getAvailableUnitsForType(t.id).length === 0) return false;
        if (ui.browseKitsOnly && !t.isKit) return false;
        return true;
      });

      if (ui.browseSort === "name") {
        list.sort((a, b) => a.name.localeCompare(b.name));
      } else if (ui.browseSort === "availability") {
        list.sort((a, b) => getAvailableUnitsForType(b.id).length - getAvailableUnitsForType(a.id).length);
      } else if (ui.browseSort === "category") {
        list.sort((a, b) => a.category.localeCompare(b.category));
      }

      return `
        <div class="page-header">
          <h1 class="page-title">Browse tools</h1>
          <div class="small muted">${activeLoans.length} of 5 tool slots in use</div>
        </div>

        <div class="form-group">
          <label class="field-label">Search tools</label>
          <div style="display:flex; gap:10px;">
            <input type="text" id="browse-search-input" placeholder="Try drill, saw, ladder" value="${escapeHtml(ui.browseSearch)}" oninput="ui.browseSearch=this.value; render();" />
            <button class="btn btn-primary" onclick="render()">Search</button>
          </div>
        </div>

        <div class="split-browse" style="margin-top:20px;">
          <aside class="card" style="padding:18px;">
            <div class="card-title" style="font-size:1rem;">Filters</div>
            <div class="form-group">
              <label class="field-label">Category</label>
              <select onchange="ui.browseCategory=this.value; render();">
                <option value="all" ${ui.browseCategory === "all" ? "selected" : ""}>All categories</option>
                ${categories.map(c => `<option value="${escapeHtml(c)}" ${ui.browseCategory === c ? "selected" : ""}>${escapeHtml(c)}</option>`).join("")}
              </select>
            </div>
            <label class="checkbox-row">
              <input type="checkbox" ${ui.browseAvailableOnly ? "checked" : ""} onchange="ui.browseAvailableOnly=this.checked; render();" />
              <span>Available now only</span>
            </label>
            <label class="checkbox-row" style="margin-bottom:14px;">
              <input type="checkbox" ${ui.browseKitsOnly ? "checked" : ""} onchange="ui.browseKitsOnly=this.checked; render();" />
              <span>Kits only</span>
            </label>
            <button class="btn btn-secondary btn-block btn-sm" onclick="ui.browseSearch=''; ui.browseCategory='all'; ui.browseAvailableOnly=false; ui.browseKitsOnly=false; render();">Clear filters</button>
          </aside>

          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
              <div class="small muted">${list.length} tool${list.length === 1 ? "" : "s"}</div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="small muted">Sort by</span>
                <select style="width:auto; padding:6px 10px;" onchange="ui.browseSort=this.value; render();">
                  <option value="name" ${ui.browseSort === "name" ? "selected" : ""}>Name</option>
                  <option value="availability" ${ui.browseSort === "availability" ? "selected" : ""}>Availability</option>
                  <option value="category" ${ui.browseSort === "category" ? "selected" : ""}>Category</option>
                </select>
              </div>
            </div>

            ${list.length === 0 ? `<div class="card"><p class="muted" style="margin:0;">No tools match your current filters.</p></div>` : `
              <div class="grid-3">
                ${list.map(t => {
                  const total = getUnitsForType(t.id).length;
                  const avail = getAvailableUnitsForType(t.id).length;
                  const wl = getWaitlistForType(t.id).length;
                  const badge = avail > 0
                    ? `<span class="badge badge-green">Available</span>`
                    : `<span class="badge badge-amber">Waitlist: ${wl} ahead</span>`;
                  return `
                    <div class="tool-card">
                      <div class="tool-photo">
                        ${renderToolSvg(t.icon, 52)}
                        <span>${t.isKit ? "Tool kit" : "Tool photo"}</span>
                      </div>
                      <div>
                        <h3 class="tool-name">${escapeHtml(t.name)}</h3>
                        <div class="small muted">${escapeHtml(t.category)} · ${avail} of ${total} available</div>
                      </div>
                      <div>${badge}</div>
                      <button class="btn ${avail > 0 ? "btn-primary" : "btn-secondary"} btn-block" onclick="navigate('patron_tool', {toolTypeId:'${t.id}'})">View details</button>
                    </div>
                  `;
                }).join("")}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderPatronToolDetail() {
      const p = getCurrentPatron();
      const t = getToolType(route.params.toolTypeId) || state.toolTypes[0];
      const total = getUnitsForType(t.id).length;
      const avail = getAvailableUnitsForType(t.id).length;
      const wl = getWaitlistForType(t.id);
      const activeLoans = getActiveLoansForPatron(p.id);
      const existingRes = state.reservations.find(r => r.patronId === p.id && r.toolTypeId === t.id);

      let actionBtn = "";
      if (existingRes) {
        actionBtn = `<div class="alert alert-info small" style="margin:14px 0;">You already have a <strong>${escapeHtml(existingRes.status)}</strong> entry for this tool. <button class="link-btn" onclick="navigate('patron_reservations')">Manage reservations</button></div>`;
      } else if (avail > 0) {
        actionBtn = `<button class="btn btn-primary" style="margin:14px 0;" onclick="patronReserveTool('${t.id}', 'Ready for pickup')">Reserve tool</button>`;
      } else {
        actionBtn = `<button class="btn btn-primary" style="margin:14px 0;" onclick="patronReserveTool('${t.id}', 'Waitlist')">Join waitlist (${wl.length} ahead)</button>`;
      }

      return `
        <div style="margin-bottom:16px;">
          <button class="link-btn small" onclick="navigate('patron_browse')">← Back to results</button>
        </div>

        <div class="grid-2" style="align-items:start;">
          <div class="tool-photo tool-photo-lg">
            ${renderToolSvg(t.icon, 110)}
            <span>${escapeHtml(t.name)}</span>
          </div>

          <div class="card" style="margin-bottom:0;">
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;">
              <h1 class="page-title" style="font-size:1.65rem;">${escapeHtml(t.name)}</h1>
              ${avail > 0 ? `<span class="badge badge-green">Available</span>` : `<span class="badge badge-amber">Waitlist: ${wl.length} ahead</span>`}
            </div>

            <table class="kv-table" style="margin-bottom:14px;">
              <tr><td class="kv-label">Category</td><td>${escapeHtml(t.category)}</td></tr>
              <tr><td class="kv-label">Units available</td><td>${avail} of ${total}</td></tr>
              <tr><td class="kv-label">Checkout period</td><td>Up to 14 days, one renewal</td></tr>
              <tr><td class="kv-label">Late fee class</td><td>${t.feeClass === "high" ? "High-demand ($3/day)" : "Standard ($1/day)"} after 1-day grace period</td></tr>
              <tr><td class="kv-label">Kit</td><td>${t.isKit ? `Yes (${escapeHtml(t.kitContents)})` : "No"}</td></tr>
            </table>

            <p class="small muted">${escapeHtml(t.description)}</p>
            <p class="small muted">Reserving holds a tool for 3 days. Bring your library card and photo ID to the library; staff process every checkout.</p>

            ${actionBtn}

            <p class="small muted">When no units are free, Reserve becomes Join waitlist and shows your place in line.</p>

            <div style="background:var(--surface-muted); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-top:16px;">
              <strong class="small">Your account</strong>
              <div class="small muted">${activeLoans.length} of 5 tool slots in use. ${p.waiverSigned ? "Waiver signed." : "Waiver required."}</div>
            </div>
          </div>
        </div>

    function handleOnlinePayment(e, amount) {
      e.preventDefault();
      const p = getCurrentPatron();

    function recordPaymentForPatron(patronId, amount, method) {
      const p = getPatron(patronId);
      let remaining = Number(amount);
      state.loans.filter(l => l.patronId === patronId).forEach(l => {
        if (remaining <= 0) return;
        const fee = computeLoanFeeDetails(l);
        if (fee.unpaid > 0) {
          const apply = Math.min(fee.unpaid, remaining);
          l.feePaid = (l.feePaid || 0) + apply;
          remaining -= apply;
        }
      });
      p.payments.unshift({
        id: "PAY-" + Math.floor(1000 + Math.random() * 9000),
        date: TODAY,
        method,
        amount: Number(amount),
        note: "Overdue tool fee payment"
      });
      saveState();
    }

      openModal(`

    function completeStaffCheckout(e) {
      e.preventDefault();
      const barcode = document.getElementById("checkout-barcode").value.trim().toUpperCase();
      const days = Math.min(14, Math.max(1, Number(document.getElementById("checkout-days").value) || 14));
      const unit = state.units.find(u => u.barcode.toUpperCase() === barcode);
      const err = document.getElementById("checkout-scan-error");

      if (!unit) {
        err.innerHTML = `<div class="alert alert-danger small">Barcode <code>${escapeHtml(barcode)}</code> not found in inventory.</div>`;
        return;
      }
      if (unit.status !== "Available") {
        err.innerHTML = `<div class="alert alert-danger small">Scan rejected: Unit <strong>${escapeHtml(unit.id)}</strong> is currently <strong>${escapeHtml(unit.status)}</strong>.</div>`;
        return;
      }

      const patronId = ui.checkoutPatronId;
      unit.status = "Checked out";
      const dueDate = addDays(TODAY, days);
      const loan = {
        id: "L" + Date.now(),
        patronId,
        toolTypeId: unit.toolTypeId,
        unitId: unit.id,
        checkoutDate: TODAY,
        dueDate,
        originalDays: days,
        returnedDate: null,
        renewed: false,
        renewalStatus: null,
        renewalReason: "",
        feePaid: 0
      };
      state.loans.push(loan);

      // Fulfill any matching reservation held by this patron
      const resIdx = state.reservations.findIndex(r => r.patronId === patronId && r.toolTypeId === unit.toolTypeId && r.status === "Ready for pickup");
      if (resIdx !== -1) state.reservations.splice(resIdx, 1);

      saveState();
      ui.checkoutLastLoanId = loan.id;
      ui.checkoutStep = 4;
      render();
      showToast("Tool checked out successfully!");
    }

      const loan = state.loans.find(l => l.id === ui.checkoutLastLoanId);

      const u = getUnit(loan.unitId);
      return `
