          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="startCheckoutFlow()">Check out another tool</button>
            <button class="btn btn-secondary" onclick="navigate('staff_home')">Done</button>
          </div>
        </div>
      `;
    }

    // --- STAFF RETURN & INSPECTION FLOW (E3 + E10) ---
    function startReturnFlow() {
      ui.returnStep = 1;
      ui.returnUnitId = null;
      ui.returnLastInfo = null;
      navigate("staff_return");
    }

    function renderStaffReturn() {
      if (ui.returnStep === 2 && ui.returnUnitId) return renderStaffReturnInspect();
      if (ui.returnStep === 3 && ui.returnLastInfo) return renderStaffReturnDone();

      const activeLoans = state.loans.filter(l => !l.returnedDate);
      return `
        <div class="breadcrumb">Return · Step 1 of 3: Scan tool</div>
        <h1 class="page-title" style="margin-bottom:20px;">Process return</h1>

        <div class="card">
          <div class="card-title">Scan barcode or select a checked-out tool</div>
          <div id="return-scan-error"></div>
          <form onsubmit="handleReturnScan(event)" style="display:flex; gap:10px; margin-bottom:20px;">
            <input type="text" id="return-barcode" placeholder="Scan barcode (e.g. BC-ES-001)" required />
            <button type="submit" class="btn btn-primary">Look up tool</button>
          </form>

          <div class="table-wrap">
            <table>
              <thead><tr><th>Tool</th><th>Barcode</th><th>Borrower</th><th>Due</th><th>Action</th></tr></thead>
              <tbody>
                ${activeLoans.map(l => {
                  const t = getToolType(l.toolTypeId);
                  const u = getUnit(l.unitId);
                  const p = getPatron(l.patronId);
                  const overdue = isLoanOverdue(l);
                  return `
                    <tr>
                      <td><strong>${escapeHtml(t.name)}</strong> ${t.isKit ? `<span class="badge badge-blue">Kit</span>` : ""}</td>
                      <td><code>${escapeHtml(u.barcode)}</code></td>
                      <td>${escapeHtml(p.name)}</td>
                      <td>${formatDateShort(l.dueDate)} ${overdue ? `<span class="badge badge-red">Overdue</span>` : ""}</td>
                      <td><button class="btn btn-secondary btn-sm" onclick="selectReturnUnit('${u.id}')">Inspect return</button></td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function handleReturnScan(e) {
      e.preventDefault();
      const bc = document.getElementById("return-barcode").value.trim().toUpperCase();
      const unit = state.units.find(u => u.barcode.toUpperCase() === bc && u.status === "Checked out");
      if (!unit) {
        document.getElementById("return-scan-error").innerHTML = `<div class="alert alert-danger small">No checked-out tool found with barcode <code>${escapeHtml(bc)}</code>.</div>`;
        return;
      }
      selectReturnUnit(unit.id);
    }

    function selectReturnUnit(unitId) {
      ui.returnUnitId = unitId;
      ui.returnStep = 2;
      render();
    }

    function renderStaffReturnInspect() {
      const u = getUnit(ui.returnUnitId);
      const loan = state.loans.find(l => l.unitId === u.id && !l.returnedDate);
      const t = getToolType(u.toolTypeId);
      const p = getPatron(loan.patronId);
      const fee = computeLoanFeeDetails(loan);
      const overdue = isLoanOverdue(loan);

      return `
        <div class="breadcrumb">Return · Step 2 of 3: Inspect tool</div>
        <h1 class="page-title" style="margin-bottom:20px;">Inspect returned tool</h1>

        <form onsubmit="completeStaffReturn(event)">
          <div class="grid-2" style="align-items:start;">
            <div class="card" style="margin-bottom:0;">
              <div class="card-title">${escapeHtml(t.name)}</div>
              <table class="kv-table">
                <tr><td class="kv-label">Barcode</td><td><code>${escapeHtml(u.barcode)}</code></td></tr>
                <tr><td class="kv-label">Borrower</td><td>${escapeHtml(p.name)}</td></tr>
                <tr><td class="kv-label">Due</td><td>${formatDateShort(loan.dueDate)} · ${overdue ? `${fee.daysLate} days late` : "returned on time"}</td></tr>
                <tr><td class="kv-label">Late fees</td><td>${fee.unpaid > 0 ? `<strong>${formatMoney(fee.unpaid)}</strong> (remains on account)` : "None"}</td></tr>
              </table>
              ${t.isKit ? `<div class="alert alert-info small" style="margin-top:14px; margin-bottom:0;"><strong>Kit inventory label:</strong> ${escapeHtml(t.kitContents)}</div>` : ""}
            </div>

            <div class="card" style="margin-bottom:0;">
              <div class="card-title">Condition</div>
              <label class="checkbox-row">
                <input type="radio" name="cond" value="good" checked onchange="document.getElementById('flag-oos').checked=false;" />
                <span>Good working order</span>
              </label>
              <label class="checkbox-row" style="margin-bottom:14px;">
                <input type="radio" name="cond" value="damaged" onchange="document.getElementById('flag-oos').checked=true;" />
                <span>Damaged or missing parts</span>
              </label>

              <div class="small muted" style="margin-bottom:6px;">Kit components (kits only)</div>
              <label class="checkbox-row" style="margin-bottom:14px;">
                <input type="checkbox" id="kit-check" ${t.isKit ? "checked" : ""} />
                <span>Every component matches the kit label</span>
              </label>

              <div class="form-group">
                <label class="field-label">Condition notes</label>
                <textarea id="return-notes" placeholder="Describe any damage, missing parts, or maintenance needed..."></textarea>
              </div>

              <label class="checkbox-row" style="margin-bottom:0;">
                <input type="checkbox" id="flag-oos" />
                <span>Flag out of service after return</span>
              </label>
            </div>
          </div>

          <div style="display:flex; gap:12px; margin-top:20px;">
            <button type="submit" class="btn btn-primary">Complete return</button>
            <button type="button" class="btn btn-secondary" onclick="startReturnFlow()">Cancel</button>
          </div>
        </form>
      `;
    }

    function completeStaffReturn(e) {
      e.preventDefault();
      const u = getUnit(ui.returnUnitId);
      const loan = state.loans.find(l => l.unitId === u.id && !l.returnedDate);
      const t = getToolType(u.toolTypeId);
      const p = getPatron(loan.patronId);
      const notes = document.getElementById("return-notes").value.trim();
      const flagOos = document.getElementById("flag-oos").checked;

      loan.returnedDate = TODAY;
      t.historicalLoans = (t.historicalLoans || 0) + 1;

      let promotedPatronName = null;
      if (flagOos) {
        u.status = "Out of service";
        u.note = notes || "Flagged damaged/needs maintenance during return inspection.";
      } else {
        u.status = "Available";
        u.note = "";
        // Promote first patron on waitlist if any
        const nextWait = state.reservations.find(r => r.toolTypeId === t.id && r.status === "Waitlist");
        if (nextWait) {
          nextWait.status = "Ready for pickup";
          nextWait.pickupBy = addDays(TODAY, 3);
          promotedPatronName = getPatron(nextWait.patronId).name;
        }
      }

      saveState();
      ui.returnLastInfo = {
        toolName: t.name,
        barcode: u.barcode,
        patronName: p.name,
        newStatus: u.status,
        promotedPatronName
      };
      ui.returnStep = 3;
      render();
      showToast("Return completed.");
    }

    function renderStaffReturnDone() {
      const info = ui.returnLastInfo;
      return `
        <div class="breadcrumb">Return · Step 3 of 3: Confirmation</div>
        <div class="card" style="max-width:600px;">
          <div class="badge badge-green" style="margin-bottom:10px;">Return Completed</div>
          <h1 class="page-title" style="font-size:1.5rem; margin-bottom:12px;">${escapeHtml(info.toolName)} returned</h1>
          <p class="small">Returned by <strong>${escapeHtml(info.patronName)}</strong> (<code>${escapeHtml(info.barcode)}</code>).</p>
          <p class="small">New unit status: <span class="badge ${info.newStatus === "Available" ? "badge-green" : "badge-red"}">${escapeHtml(info.newStatus)}</span></p>
          ${info.promotedPatronName ? `<div class="alert alert-info small"><strong>Waitlist advanced:</strong> ${escapeHtml(info.promotedPatronName)} has been notified and given a 3-day pickup hold.</div>` : ""}
          <div style="display:flex; gap:10px; margin-top:16px;">
            <button class="btn btn-primary" onclick="startReturnFlow()">Process another return</button>
            <button class="btn btn-secondary" onclick="navigate('staff_home')">Done</button>
          </div>
        </div>
      `;
    }

    // --- STAFF RENEWALS (E4) ---
    function renderStaffRenewals() {
      const pending = state.loans.filter(l => !l.returnedDate && l.renewalStatus === "pending");
      return `
        <h1 class="page-title" style="margin-bottom:20px;">Renewal requests</h1>
        <div class="card">
          ${pending.length === 0 ? `<p class="small muted">No pending renewal requests right now.</p>` : `
            <div class="table-wrap">
              <table>
                <thead><tr><th>Patron</th><th>Tool</th><th>Current Due</th><th>Waitlist</th><th>Actions</th></tr></thead>
                <tbody>
                  ${pending.map(l => {
                    const p = getPatron(l.patronId);
                    const t = getToolType(l.toolTypeId);
                    const wl = getWaitlistForType(l.toolTypeId).length;
                    return `
                      <tr>
                        <td><strong>${escapeHtml(p.name)}</strong></td>
                        <td>${escapeHtml(t.name)}</td>
                        <td>${formatDateShort(l.dueDate)}</td>
                        <td>${wl > 0 ? `<span class="badge badge-amber">${wl} waiting</span>` : `<span class="badge badge-green">None</span>`}</td>
                        <td style="display:flex; gap:8px;">
                          <button class="btn btn-primary btn-sm" ${wl > 0 ? "disabled" : ""} onclick="approveRenewal('${l.id}')">Approve (+${l.originalDays || 14}d)</button>
                          <button class="btn btn-secondary btn-sm" onclick="openDenyRenewalModal('${l.id}')">Deny</button>
                        </td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function approveRenewal(loanId) {
      const l = state.loans.find(x => x.id === loanId);
      if (!l) return;
      l.dueDate = addDays(l.dueDate, l.originalDays || 14);
      l.renewed = true;
      l.renewalStatus = "approved";
      saveState();
      render();
      showToast(`Renewal approved! New due date: ${formatDateShort(l.dueDate)}.`);
    }

    function openDenyRenewalModal(loanId) {
      openModal(`
        <h2 class="card-title">Deny Renewal Request</h2>
        <form onsubmit="confirmDenyRenewal(event, '${loanId}')">
          <div class="form-group">
            <label class="field-label">Reason for denial (sent to patron)</label>
            <input type="text" id="deny-reason" value="Another patron is waiting for this tool." required />
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Deny request</button>
          </div>
        </form>
      `);
    }

    function confirmDenyRenewal(e, loanId) {
      e.preventDefault();
      const l = state.loans.find(x => x.id === loanId);
      if (l) {
        l.renewalStatus = "denied";
        l.renewalReason = document.getElementById("deny-reason").value.trim();
        saveState();
      }
      closeModal();
      render();
      showToast("Renewal request denied and patron notified.");
    }

    // --- STAFF INVENTORY (E5 + E10) ---
    function renderStaffInventory() {
      const total = state.units.length;
      const avail = state.units.filter(u => u.status === "Available").length;
      const out = state.units.filter(u => u.status === "Checked out").length;
      const oos = state.units.filter(u => u.status === "Out of service").length;
      const retired = state.units.filter(u => u.status === "Retired").length;

      return `
        <div class="page-header">
          <h1 class="page-title">Inventory</h1>
          <div class="small muted">${total} units · ${avail} available · ${out} checked out · ${oos} out of service · ${retired} retired</div>
        </div>

        <div class="split-inventory">
          <div class="card">
            <div class="card-title">Tools (${total} units, ${state.toolTypes.length} tool types)</div>
            ${state.toolTypes.map(t => {
              const units = state.units.filter(u => u.toolTypeId === t.id);
              const availCount = units.filter(u => u.status === "Available").length;
              const expanded = !!ui.expandedInvGroups[t.id];
              return `
                <div class="inv-group">
                  <div class="inv-group-header" onclick="ui.expandedInvGroups['${t.id}']=!ui.expandedInvGroups['${t.id}']; render();">
                    <div>
                      <strong>${escapeHtml(t.name)}</strong>
                      ${expanded ? `<div class="small muted" style="margin-top:3px;">${escapeHtml(t.category)} · ${t.feeClass === "high" ? "High-demand ($3/day)" : "Standard ($1/day)"} · Replacement value $${t.replacementValue} · ${t.isKit ? "Kit" : "Not a kit"}</div>` : ""}
                    </div>
                    <div class="small muted">${units.length} unit${units.length === 1 ? "" : "s"} · ${availCount} available ${expanded ? "▾" : "▸"}</div>
                  </div>

                  ${expanded ? `
                    <div class="table-wrap" style="margin-top:12px;">
                      <table>
                        <thead><tr><th>Unit ID</th><th>Barcode</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                          ${units.map(u => {
                            const statusBadge =
                              u.status === "Available" ? `<span class="badge badge-green">Available</span>` :
                              u.status === "Checked out" ? `<span class="badge badge-blue">Checked out</span>` :
                              u.status === "Out of service" ? `<span class="badge badge-red">Out of service</span>` :
                              `<span class="badge badge-gray">Retired</span>`;
                            return `
                              <tr>
                                <td><code>${escapeHtml(u.id)}</code></td>
                                <td><code>${escapeHtml(u.barcode)}</code></td>
                                <td>
                                  ${statusBadge}
                                  ${u.note ? `<div class="small muted" style="margin-top:4px; max-width:200px;">${escapeHtml(u.note)}</div>` : ""}
                                </td>
                                <td>
                                  <div style="display:flex; flex-wrap:wrap; gap:6px;">
                                    <button class="btn btn-secondary btn-sm" onclick="openEditToolModal('${t.id}')">Edit</button>
                                    ${u.status === "Available" ? `<button class="btn btn-secondary btn-sm" onclick="openFlagOosModal('${u.id}')">Flag out of service</button>` : ""}
                                    ${u.status === "Out of service" ? `<button class="btn btn-primary btn-sm" onclick="markUnitInService('${u.id}')">Mark in service</button>` : ""}
                                    ${u.status !== "Retired" ? `
                                      <button class="btn btn-secondary btn-sm" ${u.status === "Checked out" ? "disabled" : ""} onclick="retireUnit('${u.id}')">Retire</button>
                                    ` : ""}
                                  </div>
                                  ${u.status === "Checked out" ? `<div class="small muted" style="font-size:0.76rem; margin-top:3px;">Return it before retiring</div>` : ""}
                                </td>
                              </tr>
                            `;
                          }).join("")}
                        </tbody>
                      </table>
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}
          </div>

          <div class="card">
            <div class="card-title">Add tool</div>
            <form onsubmit="handleAddTool(event)">
              <div class="form-group">
                <label class="field-label">Tool name</label>
                <input type="text" id="add-name" placeholder="e.g. Tile saw" required />
              </div>
              <div class="form-group">
                <label class="field-label">Category</label>
                <select id="add-cat">
                  <option>Power tools</option>
                  <option>Hand tools</option>
                  <option>Yard and garden</option>
                  <option>Automotive &amp; Plumbing</option>
                </select>
              </div>
              <div class="form-group">
                <label class="field-label">Fee class</label>
                <select id="add-fee">
                  <option value="standard">Standard ($1 per day)</option>
                  <option value="high">High-demand ($3 per day)</option>
                </select>
              </div>
              <div class="form-group">
                <label class="field-label">Replacement value ($)</label>
                <input type="number" id="add-val" min="5" value="85" required />
              </div>
              <label class="checkbox-row" style="margin-bottom:14px;">
                <input type="checkbox" id="add-kit" />
                <span>This tool is a kit</span>
              </label>
              <div class="form-group">
                <label class="field-label">Unit ID</label>
                <input type="text" id="add-uid" placeholder="e.g. TS-02" required />
              </div>
              <div class="form-group">
                <label class="field-label">Barcode</label>
                <input type="text" id="add-bc" placeholder="e.g. BC-TS-002" required />
              </div>
              <button type="submit" class="btn btn-primary btn-block">Add to inventory</button>
            </form>
          </div>
        </div>
      `;
    }

    function handleAddTool(e) {
      e.preventDefault();
      const name = document.getElementById("add-name").value.trim();
      const cat = document.getElementById("add-cat").value;
      const feeClass = document.getElementById("add-fee").value;
      const val = Number(document.getElementById("add-val").value) || 50;
      const isKit = document.getElementById("add-kit").checked;
      const uid = document.getElementById("add-uid").value.trim().toUpperCase();
      const bc = document.getElementById("add-bc").value.trim().toUpperCase();

      let existingType = state.toolTypes.find(t => t.name.toLowerCase() === name.toLowerCase());
      if (!existingType) {
        existingType = {
          id: "T" + (state.toolTypes.length + 1),
          name, category: cat, feeClass, replacementValue: val, isKit,
          kitContents: isKit ? "Standard kit components (see label)" : "",
          description: `${name} available for county library borrowing.`,
          icon: "drill",
          historicalLoans: 0
        };
        state.toolTypes.push(existingType);
      }

      state.units.push({ id: uid, toolTypeId: existingType.id, barcode: bc, status: "Available", note: "" });
      ui.expandedInvGroups[existingType.id] = true;
      saveState();
      render();
      showToast(`Added ${name} (${uid}) to inventory.`);
    }

    function openEditToolModal(toolTypeId) {
      const t = getToolType(toolTypeId);
      openModal(`
        <h2 class="card-title">Edit Tool Type: ${escapeHtml(t.name)}</h2>
        <form onsubmit="saveEditTool(event, '${t.id}')">
          <div class="form-group">
            <label class="field-label">Tool name</label>
            <input type="text" id="edit-name" value="${escapeHtml(t.name)}" required />
          </div>
          <div class="form-group">
            <label class="field-label">Replacement value ($)</label>
            <input type="number" id="edit-val" value="${t.replacementValue}" required />
          </div>
          <div class="form-group">
            <label class="field-label">Fee class</label>
            <select id="edit-fee">
              <option value="standard" ${t.feeClass === "standard" ? "selected" : ""}>Standard ($1/day)</option>
              <option value="high" ${t.feeClass === "high" ? "selected" : ""}>High-demand ($3/day)</option>
            </select>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      `);
    }

    function saveEditTool(e, toolTypeId) {
      e.preventDefault();
      const t = getToolType(toolTypeId);
      t.name = document.getElementById("edit-name").value.trim();
      t.replacementValue = Number(document.getElementById("edit-val").value) || t.replacementValue;
      t.feeClass = document.getElementById("edit-fee").value;
      saveState();
      closeModal();
      render();
      showToast("Tool information updated.");
    }

    function openFlagOosModal(unitId) {
      const u = getUnit(unitId);
      openModal(`
        <h2 class="card-title">Flag Out of Service (${escapeHtml(u.id)})</h2>
        <p class="small muted">The waitlist remains unchanged; holds resume once marked back in service.</p>
        <form onsubmit="confirmFlagOos(event, '${u.id}')">
          <div class="form-group">
            <label class="field-label">Maintenance / Damage Note</label>
            <textarea id="oos-note" placeholder="e.g. Blade guard jammed, missing charger..." required></textarea>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Mark Out of Service</button>
          </div>
        </form>
      `);
    }

    function confirmFlagOos(e, unitId) {
      e.preventDefault();
      const u = getUnit(unitId);
      u.status = "Out of service";
      u.note = document.getElementById("oos-note").value.trim();
      saveState();
      closeModal();
      render();
      showToast(`Unit ${u.id} flagged Out of Service.`);
    }

    function markUnitInService(unitId) {
      const u = getUnit(unitId);
      u.status = "Available";
      u.note = "";
      promoteNextWaitlist(u.toolTypeId);
      saveState();
      render();
      showToast(`Unit ${u.id} returned to service and marked Available.`);
    }

    function retireUnit(unitId) {
      const u = getUnit(unitId);
      if (u.status === "Checked out") return;
      u.status = "Retired";
      saveState();
      render();
      showToast(`Unit ${u.id} has been retired.`);
    }

    // --- STAFF RESERVATIONS & WAITLISTS (E6) ---
    function renderStaffReservations() {
      return `
        <h1 class="page-title" style="margin-bottom:20px;">Reservations &amp; waitlists</h1>

        <div class="grid-2" style="align-items:start;">
          <div class="card">
            <div class="card-title">Active holds &amp; waitlists (${state.reservations.length})</div>
            ${state.reservations.length === 0 ? `<p class="small muted">No active reservations or waitlists.</p>` : `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Tool</th><th>Patron</th><th>Status</th><th>Action</th></tr></thead>
                  <tbody>
                    ${state.reservations.map(r => `
                      <tr>
                        <td><strong>${escapeHtml(getToolType(r.toolTypeId).name)}</strong></td>
                        <td>${escapeHtml(getPatron(r.patronId).name)}</td>
                        <td>
                          <span class="badge ${r.status === "Ready for pickup" ? "badge-green" : "badge-amber"}">${escapeHtml(r.status)}</span>
                          ${r.pickupBy ? `<div class="small muted">By ${formatDateShort(r.pickupBy)}</div>` : ""}
                        </td>
                        <td><button class="btn btn-secondary btn-sm" onclick="cancelReservation('${r.id}')">Cancel</button></td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            `}
          </div>

          <div class="card">
            <div class="card-title">Reserve on behalf of patron</div>
            <form onsubmit="staffCreateReservation(event)">
              <div class="form-group">
                <label class="field-label">Select Patron</label>
                <select id="sres-patron">
                  ${state.patrons.map(p => `<option value="${p.id}">${escapeHtml(p.name)} (${p.cardNumber})</option>`).join("")}
                </select>
              </div>
              <div class="form-group">
                <label class="field-label">Select Tool Type</label>
                <select id="sres-tool">
                  ${state.toolTypes.filter(t => getUnitsForType(t.id).length > 0).map(t => {
                    const av = getAvailableUnitsForType(t.id).length;
                    return `<option value="${t.id}">${escapeHtml(t.name)} (${av > 0 ? av + " available" : "Waitlist"})</option>`;
                  }).join("")}
                </select>
              </div>
              <button type="submit" class="btn btn-primary">Create reservation / add to waitlist</button>
            </form>
          </div>
        </div>
      `;
    }

    function staffCreateReservation(e) {
      e.preventDefault();
      const patronId = document.getElementById("sres-patron").value;
      const toolTypeId = document.getElementById("sres-tool").value;
      const avail = getAvailableUnitsForType(toolTypeId).length;
      const status = avail > 0 ? "Ready for pickup" : "Waitlist";
      state.reservations.push({
        id: "R" + Date.now(),
        patronId,
        toolTypeId,
        status,
        createdAt: TODAY,
        pickupBy: status === "Ready for pickup" ? addDays(TODAY, 3) : null
      });
      saveState();
      render();
      showToast(`Created ${status} entry for ${getPatron(patronId).name}.`);
    }

    // --- STAFF UNRETURNED TOOLS & PATRON ACCOUNTS / PAYMENTS (E7 + E8) ---
    function renderStaffUnreturned() {
      const overdue = state.loans.filter(isLoanOverdue);
      return `
        <h1 class="page-title" style="margin-bottom:20px;">Unreturned tools &amp; patron accounts</h1>

        <div class="card">
          <div class="card-title">Unreturned tools (${overdue.length})</div>
          ${overdue.length === 0 ? `<p class="small muted">No unreturned/overdue tools right now.</p>` : `
            <div class="table-wrap">
              <table>
                <thead><tr><th>Patron</th><th>Tool</th><th>Due date</th><th>Days overdue</th><th>Accrued fee</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                  ${overdue.map(l => {
                    const p = getPatron(l.patronId);
                    const t = getToolType(l.toolTypeId);
                    const fee = computeLoanFeeDetails(l);
                    return `
                      <tr>
                        <td><strong>${escapeHtml(p.name)}</strong></td>
                        <td>${escapeHtml(t.name)}</td>
                        <td>${formatDateShort(l.dueDate)}</td>
                        <td>${fee.daysLate}</td>
                        <td><strong>${formatMoney(fee.unpaid)}</strong></td>
                        <td><span class="badge badge-red">Unreturned</span></td>
                        <td><button class="btn btn-secondary btn-sm" onclick="navigate('staff_patron', {patronId:'${p.id}'})">Open patron account</button></td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          `}
        </div>

        <div class="card">
          <div class="card-title">All patron accounts (In-person fee payments)</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Patron</th><th>Library Card</th><th>Active Loans</th><th>Balance Owed</th><th>Action</th></tr></thead>
              <tbody>
                ${state.patrons.map(p => {
                  const bal = getPatronOutstandingFees(p.id);
                  return `
                    <tr>
                      <td><strong>${escapeHtml(p.name)}</strong></td>
                      <td><code>${escapeHtml(p.cardNumber)}</code></td>
                      <td>${getActiveLoansForPatron(p.id).length} of 5</td>
                      <td>${bal > 0 ? `<strong style="color:var(--red-text);">${formatMoney(bal)}</strong>` : formatMoney(0)}</td>
                      <td><button class="btn btn-secondary btn-sm" onclick="navigate('staff_patron', {patronId:'${p.id}'})">Open account</button></td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderStaffPatronAccount() {
      const p = getPatron(route.params.patronId) || state.patrons[0];
      const balance = getPatronOutstandingFees(p.id);
      const loans = getActiveLoansForPatron(p.id);

      return `
        <div style="margin-bottom:14px;">
          <button class="link-btn small" onclick="navigate('staff_unreturned')">← Back to unreturned &amp; accounts</button>
        </div>

        <div class="page-header">
          <h1 class="page-title">${escapeHtml(p.name)}</h1>
          <div class="small muted">Card: <code>${escapeHtml(p.cardNumber)}</code> · Waiver signed ${formatDateShort(p.waiverDate)}</div>
        </div>

        <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
          <div>
            <div class="small muted">Outstanding fee balance</div>
            <div class="stat-value">${formatMoney(balance)}</div>
          </div>
          <button class="btn btn-primary" ${balance <= 0 ? "disabled" : ""} onclick="openStaffRecordPaymentModal('${p.id}', ${balance})">Record in-person payment</button>
        </div>

        <div class="card">
          <div class="card-title">Active loans (${loans.length})</div>
          ${loans.length === 0 ? `<p class="small muted">No active loans.</p>` : `
            <div class="table-wrap">
              <table>
                <thead><tr><th>Tool</th><th>Due</th><th>Status</th><th>Unpaid Fee</th></tr></thead>
                <tbody>
                  ${loans.map(l => {
                    const fee = computeLoanFeeDetails(l);
                    const od = isLoanOverdue(l);
                    return `
                      <tr>
                        <td><strong>${escapeHtml(getToolType(l.toolTypeId).name)}</strong></td>
                        <td>${formatDateShort(l.dueDate)}</td>
                        <td>${od ? `<span class="badge badge-red">Unreturned</span>` : `<span class="badge badge-green">On loan</span>`}</td>
                        <td>${formatMoney(fee.unpaid)}</td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          `}
        </div>

        <div class="card">
          <div class="card-title">Payment history</div>
          ${p.payments.length === 0 ? `<p class="small muted">No payments recorded yet.</p>` : `
            <div class="table-wrap">
              <table>
                <thead><tr><th>Receipt</th><th>Date</th><th>Method</th><th>Amount</th></tr></thead>
                <tbody>
                  ${p.payments.map(pay => `
                    <tr>
                      <td><code>${escapeHtml(pay.id)}</code></td>
                      <td>${formatDateShort(pay.date)}</td>
                      <td>${escapeHtml(pay.method)}</td>
                      <td>${formatMoney(pay.amount)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function openStaffRecordPaymentModal(patronId, balance) {
      openModal(`
        <h2 class="card-title">Record In-Person Payment</h2>
        <form onsubmit="handleStaffRecordPayment(event, '${patronId}')">
          <div class="form-group">
            <label class="field-label">Payment Amount ($)</label>
            <input type="number" id="spay-amt" step="0.01" min="0.01" max="${balance.toFixed(2)}" value="${balance.toFixed(2)}" required />
          </div>
          <div class="form-group">
            <label class="field-label">Payment Method</label>
            <select id="spay-method">
              <option>In person (Cash)</option>
              <option>In person (Card)</option>
              <option>In person (Check)</option>
            </select>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save payment</button>
          </div>
        </form>
      `);
    }

    function handleStaffRecordPayment(e, patronId) {
      e.preventDefault();
      const amt = Number(document.getElementById("spay-amt").value);
      const method = document.getElementById("spay-method").value;
      recordPaymentForPatron(patronId, amt, method);
      closeModal();
      render();
      showToast(`Recorded ${formatMoney(amt)} payment.`);
    }

    // --- STAFF REPORTS (E9) ---
    function renderStaffReports() {
      const tab = ui.staffReportTab;
      let content = "";

      if (tab === "checked_out") {
        const active = state.loans.filter(l => !l.returnedDate);
        content = `
          <div class="card-title" style="margin-bottom:2px;">Currently checked out</div>
          <div class="small muted" style="margin-bottom:14px;">Generated ${formatDateShort(TODAY)} · ${active.length} active loans</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Patron</th><th>Tool</th><th>Barcode</th><th>Checked out</th><th>Due date</th><th>Status</th></tr></thead>
              <tbody>
                ${active.map(l => `
                  <tr>
                    <td><strong>${escapeHtml(getPatron(l.patronId).name)}</strong></td>
                    <td>${escapeHtml(getToolType(l.toolTypeId).name)}</td>
                    <td><code>${escapeHtml(getUnit(l.unitId).barcode)}</code></td>
                    <td>${formatDateShort(l.checkoutDate)}</td>
                    <td>${formatDateShort(l.dueDate)}</td>
                    <td>${isLoanOverdue(l) ? `<span class="badge badge-red">Unreturned</span>` : `<span class="badge badge-green">On loan</span>`}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      } else if (tab === "overdue") {
        const overdue = state.loans.filter(isLoanOverdue);
        content = `
          <div class="card-title" style="margin-bottom:2px;">Overdue tools</div>
          <div class="small muted" style="margin-bottom:14px;">Generated ${formatDateShort(TODAY)}</div>
          ${overdue.length === 0 ? `<p class="small muted">No overdue tools!</p>` : `
            <div class="table-wrap">
              <table>
                <thead><tr><th>Patron</th><th>Tool</th><th>Due date</th><th>Days overdue</th><th>Accrued fee</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                  ${overdue.map(l => {
                    const p = getPatron(l.patronId);
                    const fee = computeLoanFeeDetails(l);
                    return `
                      <tr>
                        <td><strong>${escapeHtml(p.name)}</strong></td>
                        <td>${escapeHtml(getToolType(l.toolTypeId).name)}</td>
                        <td>${formatDateShort(l.dueDate)}</td>
                        <td>${fee.daysLate}</td>
                        <td>${formatMoney(fee.unpaid)}</td>
                        <td><span class="badge badge-red">Unreturned</span></td>
                        <td><button class="btn btn-secondary btn-sm" onclick="navigate('staff_patron', {patronId:'${p.id}'})">Open patron account</button></td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          `}
        `;
      } else if (tab === "repair") {
        const oos = state.units.filter(u => u.status === "Out of service");
        content = `
          <div class="card-title" style="margin-bottom:2px;">Tools in repair</div>
          <div class="small muted" style="margin-bottom:14px;">Generated ${formatDateShort(TODAY)}</div>
          ${oos.length === 0 ? `<p class="small muted">All tools are currently in service.</p>` : `
            <div class="table-wrap">
              <table>
                <thead><tr><th>Tool</th><th>Unit ID</th><th>Barcode</th><th>Maintenance notes</th><th>Action</th></tr></thead>
                <tbody>
                  ${oos.map(u => `
                    <tr>
                      <td><strong>${escapeHtml(getToolType(u.toolTypeId).name)}</strong></td>
                      <td><code>${escapeHtml(u.id)}</code></td>
                      <td><code>${escapeHtml(u.barcode)}</code></td>
                      <td>${escapeHtml(u.note || "No notes provided")}</td>
                      <td><button class="btn btn-primary btn-sm" onclick="markUnitInService('${u.id}')">Mark in service</button></td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `}
        `;
      } else if (tab === "most_borrowed") {
        const ranked = [...state.toolTypes].map(t => {
          const activeCount = state.loans.filter(l => l.toolTypeId === t.id && !l.returnedDate).length;
          return { tool: t, totalLoans: (t.historicalLoans || 0) + activeCount };
        }).sort((a, b) => b.totalLoans - a.totalLoans);

        content = `
          <div class="card-title" style="margin-bottom:2px;">Most borrowed tools</div>
          <div class="small muted" style="margin-bottom:14px;">Generated ${formatDateShort(TODAY)} · Ranked by total loans</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Rank</th><th>Tool type</th><th>Category</th><th>Total loans</th></tr></thead>
              <tbody>
                ${ranked.map((r, i) => `
                  <tr>
                    <td><strong>#${i + 1}</strong></td>
                    <td><strong>${escapeHtml(r.tool.name)}</strong></td>
                    <td>${escapeHtml(r.tool.category)}</td>
                    <td>${r.totalLoans}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      return `
        <h1 class="page-title" style="margin-bottom:20px;">Reports</h1>

        <div class="grid-4" style="margin-bottom:20px;">
          <button class="report-tab ${tab === 'checked_out' ? 'active' : ''}" onclick="ui.staffReportTab='checked_out'; render();">
            <div class="report-tab-title">Currently checked out</div>
            <div class="small muted">All active loans</div>
          </button>
          <button class="report-tab ${tab === 'overdue' ? 'active' : ''}" onclick="ui.staffReportTab='overdue'; render();">
            <div class="report-tab-title">Overdue</div>
            <div class="small muted">All unreturned loans</div>
          </button>
          <button class="report-tab ${tab === 'repair' ? 'active' : ''}" onclick="ui.staffReportTab='repair'; render();">
            <div class="report-tab-title">In repair</div>
            <div class="small muted">All out of service tools, with notes</div>
          </button>
          <button class="report-tab ${tab === 'most_borrowed' ? 'active' : ''}" onclick="ui.staffReportTab='most_borrowed'; render();">
            <div class="report-tab-title">Most borrowed</div>
            <div class="small muted">Tool types ranked by number of loans</div>
          </button>
        </div>

        <div class="card">${content}</div>
      `;
    }

    /*************************************************************************
     * MASTER RENDER LOOP
     *************************************************************************/
    function render() {
      renderTopbar();
      const app = document.getElementById("app");
      const pages = {
        landing: renderLanding,
        login: renderLogin,
        register: renderRegister,
        waiver: renderWaiver,
        staff_login: renderStaffLogin,
        patron_dashboard: renderPatronDashboard,
        patron_browse: renderPatronBrowse,
        patron_tool: renderPatronToolDetail,
        patron_loans: renderPatronLoans,
        patron_reservations: renderPatronReservations,
        patron_fees: renderPatronFees,
        staff_home: renderStaffHome,
        staff_checkout: renderStaffCheckout,
        staff_return: renderStaffReturn,
        staff_renewals: renderStaffRenewals,
        staff_inventory: renderStaffInventory,
        staff_reservations: renderStaffReservations,
        staff_unreturned: renderStaffUnreturned,
        staff_patron: renderStaffPatronAccount,
        staff_reports: renderStaffReports
      };

      const fn = pages[route.page] || renderLanding;
      app.innerHTML = fn();
    }

    window.addEventListener("hashchange", () => { initFromHash(); render(); });
    initFromHash();
    render();
  </script>
</body>
</html>
